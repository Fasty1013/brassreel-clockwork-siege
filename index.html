<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0907" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>BRASSREEL: Clockwork Siege</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b0907;
      /* the bars around the game on screens of another shape: dark brass, not flat black */
      background-image:
        radial-gradient(ellipse at center, rgba(181, 118, 71, 0.10) 0%, rgba(11, 9, 7, 0) 70%),
        repeating-linear-gradient(45deg, rgba(255, 209, 102, 0.025) 0 2px, transparent 2px 14px);
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
    }
    body {
      /* keep clear of the camera cut-out and rounded corners on phones */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      /* main.ts switches to smooth scaling when the window is smaller than the game */
      image-rendering: pixelated;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
    }
    /* phones held upright: the game is landscape only */
    #rotate-hint {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      background: #0b0907;
      color: #ffd166;
      font: 700 22px Rubik, sans-serif;
      text-align: center;
      padding: 24px;
    }
    #rotate-hint .phone {
      width: 46px;
      height: 80px;
      border: 4px solid #d4a373;
      border-radius: 8px;
      animation: turn 2.2s ease-in-out infinite;
    }
    @keyframes turn {
      0%, 30% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-hint { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="rotate-hint"><div class="phone"></div>Поверните телефон горизонтально</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
