name: Build Android APK

# Builds the Android app (Capacitor wrapper around dist/) on every push to main and on demand.
# The APK is kept as a workflow artifact and published as the pre-release «android-latest»,
# so it can be downloaded straight to a phone from the Releases page.
on:
  push:
    branches: [main, android-build]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # the desktop wrapper is not needed here
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm test
      - run: npm run build

      # copy dist/ into the Android project (the Android SDK comes preinstalled on the runner)
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK after the version
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE="BRASSREEL-v${VERSION}-android.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish as pre-release «android-latest»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest "${{ steps.apk.outputs.file }}" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "BRASSREEL v${{ steps.apk.outputs.version }} — Android (последняя сборка)" \
            --notes "APK собран из коммита ${{ github.sha }}. Установка: скачайте файл на телефон и откройте; разрешите установку из неизвестных источников. Отладочная подпись; Android 7.0 и новее; игра только в горизонтальной ориентации."
